# The workflow name
name: Run unit tests

# Controls when the workflow will run
# - push will trigger when a push to any branch is made (only when any lua file is changed)
# - pull_request will trigger when a PR is made and when new commits are made on a PR (only when any lua file is changed)
# - workflow_dispatch is a manual trigger
on: 
  push:
    paths:
      - '**.lua'
  pull_request:
    paths:
      - '**.lua'
  workflow_dispatch:

# The list of jobs this workflow executes
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Setup Lua
        uses: leafo/gh-actions-lua@v10
        with:
          # because atan2 is deprecated in 5.3
          luaVersion: "5.2.4"
      - name: Run all unit tests
        # Auto-discovers every *Test.lua in each test directory so newly added
        # tests are picked up automatically (no hand-maintained list to drift out
        # of sync). Each test is run from its own directory because they
        # require('include'). All tests run even if one fails, so every failure is
        # reported; the step exits non-zero if any test failed.
        run: |
          set -uo pipefail
          overall=0
          for dir in scripts/test scripts/courseGenerator/test scripts/pathfinder/test; do
            echo "::group::$dir"
            for t in "$dir"/*Test.lua; do
              name="$(basename "$t")"
              echo "--- $name ---"
              ( cd "$dir" && lua "$name" ) || { echo "::error::FAILED $t"; overall=1; }
            done
            echo "::endgroup::"
          done
          exit $overall